<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus Complaint Portal - Sign in</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="brand big">&#127891; Campus Complaint Portal</div>
    <p class="muted center">Raise issues. Track progress. Get resolutions.</p>
    <div class="tabs">
      <button class="tab active" data-show="login">Sign in</button>
      <button class="tab" data-show="signup">Student sign up</button>
    </div>
    <div id="msg" class="msg" role="alert"></div>

    <section id="p-login">
      <form id="f-login" class="stack">
        <label>Email<input id="l-email" type="email" required autocomplete="username"></label>
        <label>Password<input id="l-pass" type="password" required autocomplete="current-password"></label>
        <button class="btn" type="submit">Sign in</button>
        <a href="#" data-show="forgot" class="link center">Forgot password?</a>
      </form>
    </section>

    <section id="p-signup" class="hidden">
      <form id="f-signup" class="stack">
        <label>Full name<input id="s-name" required maxlength="80" autocomplete="name"></label>
        <label>College email<input id="s-email" type="email" required autocomplete="email"></label>
        <label>Password<input id="s-pass" type="password" required minlength="8" autocomplete="new-password">
          <small class="muted">At least 8 characters with upper-case, lower-case and a number.</small></label>
        <button class="btn" type="submit">Create account</button>
      </form>
    </section>

    <section id="p-verify" class="hidden">
      <form id="f-verify" class="stack">
        <label>Email<input id="v-email" type="email" required></label>
        <label>Verification code<input id="v-code" required inputmode="numeric" autocomplete="one-time-code"></label>
        <button class="btn" type="submit">Verify email</button>
        <a href="#" id="resend" class="link center">Resend code</a>
      </form>
    </section>

    <section id="p-forgot" class="hidden">
      <form id="f-forgot" class="stack">
        <label>Email<input id="f-email" type="email" required></label>
        <button class="btn" type="submit">Send reset code</button>
        <a href="#" data-show="login" class="link center">Back to sign in</a>
      </form>
    </section>

    <section id="p-reset" class="hidden">
      <form id="f-reset" class="stack">
        <label>Email<input id="r-email" type="email" required></label>
        <label>Reset code<input id="r-code" required></label>
        <label>New password<input id="r-pass" type="password" required minlength="8" autocomplete="new-password"></label>
        <button class="btn" type="submit">Set new password</button>
      </form>
    </section>
    <p class="muted center small">Administrators are created by the system owner and sign in here too.</p>
  </main>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
